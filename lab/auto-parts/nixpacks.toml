providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "cd client && npm ci",
  "cd server && npm ci"
]

[phases.build]
cmds = [
  "cd client && npm run build",
  "cd server && npx prisma generate && npm run build"
]

[start]
cmd = "cd server && npx prisma migrate deploy && npm run db:seed && npm start"
