<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>АвтоЗапчасти — UI Kit (print)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="../../assets/logo-mark.svg" type="image/svg+xml"/>
  <style>
/* ============================================================
   АвтоЗапчасти — Design Tokens
   Foundations for a calm, technical ERP/CRM aesthetic.
   ============================================================ */

/* ---------- Fonts ---------- */
/* Substitution note: the original app used Segoe UI (system font).
   We upgrade to IBM Plex Sans for premium-corporate feel with strong
   Cyrillic coverage, and JetBrains Mono for tabular/numeric content. */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* ============================================================
     COLOR — Neutrals (slate-based, calm, ERP-grade)
     ============================================================ */
  --color-bg-app:        #F4F6FA;   /* page background */
  --color-bg-surface:    #FFFFFF;   /* cards, modals, sider, header */
  --color-bg-subtle:     #F8FAFC;   /* hover rows, inset panels */
  --color-bg-muted:      #EEF1F6;   /* keyboard-shortcut chips, code, secondary fills */
  --color-bg-inverse:    #0F172A;   /* dark surface (tooltips, banners) */

  --color-border-subtle: #EEF1F6;   /* hairline dividers inside cards */
  --color-border:        #E1E6EF;   /* card edge, input border, table grid */
  --color-border-strong: #C8D0DD;   /* hover input, focus-adjacent */

  --color-fg-1:          #0F172A;   /* primary text, headings, numerals */
  --color-fg-2:          #334155;   /* body text, table cell default */
  --color-fg-3:          #64748B;   /* labels, secondary text */
  --color-fg-4:          #94A3B8;   /* hint, placeholder, disabled */
  --color-fg-inverse:    #FFFFFF;

  /* ============================================================
     COLOR — Brand (calm corporate blue)
     ============================================================ */
  --color-primary:       #2D6CDF;   /* primary actions, focus rings, active nav */
  --color-primary-hover: #245CC6;
  --color-primary-press: #1B4BAD;
  --color-primary-bg:    #EAF1FE;   /* selected-row tint, primary subtle */
  --color-primary-border:#BCD3FA;

  /* ============================================================
     COLOR — Semantic (status, feedback, business meaning)
     ============================================================ */
  --color-success:        #16A34A;
  --color-success-bg:     #ECFDF5;
  --color-success-border: #BBF7D0;

  --color-danger:         #DC2626;
  --color-danger-bg:      #FEF2F2;
  --color-danger-border:  #FECACA;

  --color-warning:        #D97706;
  --color-warning-bg:     #FFFBEB;
  --color-warning-border: #FED7AA;

  --color-info:           #2D6CDF;
  --color-info-bg:        #EAF1FE;
  --color-info-border:    #BCD3FA;

  --color-neutral-bg:     #F1F5F9;  /* default tag */
  --color-neutral-border: #E1E6EF;

  /* ============================================================
     COLOR — Role accents (Администратор / Кассир)
     ============================================================ */
  --color-role-admin:     #2D6CDF;
  --color-role-admin-bg:  #EAF1FE;
  --color-role-cashier:   #0E9F6E;
  --color-role-cashier-bg:#E6F7EF;

  /* ============================================================
     TYPOGRAPHY — Stacks
     ============================================================ */
  --font-sans: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system,
               'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Liberation Mono', monospace;
  --font-display: var(--font-sans);

  /* Type scale */
  --fs-xs:   12px;   /* hint, meta, small tag */
  --fs-sm:   13px;   /* table cell, secondary */
  --fs-base: 14px;   /* default UI text */
  --fs-md:   15px;   /* emphasized body */
  --fs-lg:   16px;   /* nav, sub-heading */
  --fs-xl:   18px;   /* card title */
  --fs-2xl:  20px;   /* page section title (h5) */
  --fs-3xl:  24px;   /* page title (h4) */
  --fs-4xl:  30px;   /* statistic number */
  --fs-5xl:  38px;   /* hero statistic */

  --lh-tight:   1.2;
  --lh-snug:    1.35;
  --lh-normal:  1.5;
  --lh-relaxed: 1.65;

  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;

  --ls-tight:  -0.011em;
  --ls-normal: 0;
  --ls-wide:    0.04em;   /* small all-caps labels */

  /* ============================================================
     SPACING — 4px base
     ============================================================ */
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* ============================================================
     RADIUS
     ============================================================ */
  --radius-xs:   4px;   /* tag, small chip */
  --radius-sm:   6px;   /* button, input */
  --radius-md:   8px;   /* card, modal body, table */
  --radius-lg:  10px;   /* modal, login card */
  --radius-xl:  14px;   /* hero panels */
  --radius-pill: 999px;

  /* ============================================================
     ELEVATION — calm, layered
     ============================================================ */
  --shadow-xs:    0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm:    0 2px 8px rgba(15, 23, 42, 0.06);            /* card resting */
  --shadow-md:    0 4px 16px rgba(15, 23, 42, 0.08);           /* card hover, dropdown */
  --shadow-lg:    0 12px 32px rgba(15, 23, 42, 0.10);          /* modal */
  --shadow-focus: 0 0 0 3px rgba(45, 108, 223, 0.18);          /* focus ring */

  /* Inset (for inputs / pressed) */
  --shadow-inset: inset 0 1px 0 rgba(15, 23, 42, 0.04);

  /* ============================================================
     LAYOUT
     ============================================================ */
  --layout-sider-w: 232px;
  --layout-header-h: 56px;
  --layout-content-pad: 24px;

  /* ============================================================
     MOTION — quick, calm, no bounces
     ============================================================ */
  --ease-out:      cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in-out:   cubic-bezier(0.4, 0.0, 0.2, 1);
  --dur-fast:      120ms;
  --dur-base:      180ms;
  --dur-slow:      240ms;

  /* ============================================================
     Z-INDEX
     ============================================================ */
  --z-sticky:  100;
  --z-header:  200;
  --z-drawer:  900;
  --z-modal:  1000;
  --z-toast:  1100;
}

/* ============================================================
   SEMANTIC TYPOGRAPHY — apply these directly to elements
   ============================================================ */

.t-display {
  font-family: var(--font-display);
  font-size: var(--fs-4xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--color-fg-1);
}

.t-h1, h1.t {
  font-family: var(--font-display);
  font-size: var(--fs-3xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--color-fg-1);
  margin: 0;
}

.t-h2, h2.t {
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-tight);
  color: var(--color-fg-1);
  margin: 0;
}

.t-h3, h3.t {
  font-family: var(--font-sans);
  font-size: var(--fs-xl);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--color-fg-1);
  margin: 0;
}

.t-h4, h4.t {
  font-family: var(--font-sans);
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--color-fg-1);
  margin: 0;
}

.t-body, p.t {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  font-weight: var(--fw-regular);
  line-height: var(--lh-normal);
  color: var(--color-fg-2);
  margin: 0;
}

.t-body-sm {
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  font-weight: var(--fw-regular);
  line-height: var(--lh-normal);
  color: var(--color-fg-2);
}

.t-label {
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
  color: var(--color-fg-3);
}

.t-overline {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-wide);
  text-transform: uppercase;
  color: var(--color-fg-3);
}

.t-caption {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-regular);
  line-height: var(--lh-snug);
  color: var(--color-fg-3);
}

.t-mono {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  font-weight: var(--fw-regular);
  font-variant-numeric: tabular-nums;
  color: var(--color-fg-2);
}

.t-numeric {
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
  font-weight: var(--fw-medium);
  color: var(--color-fg-1);
}

.t-stat {
  font-family: var(--font-display);
  font-size: var(--fs-4xl);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--color-fg-1);
}

/* ============================================================
   GLOBAL DEFAULTS
   ============================================================ */
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  color: var(--color-fg-2);
  background: var(--color-bg-app);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}


* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--color-fg-2);
  background: var(--color-bg-app);
  -webkit-font-smoothing: antialiased;
}

/* App shell ===================================================== */
.app { display: flex; min-height: 100vh; }
.sider {
  width: var(--layout-sider-w);
  background: var(--color-bg-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sider .brand {
  height: var(--layout-header-h);
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--color-border-subtle);
}
.sider .brand .name {
  font-size: 15px;
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: -0.005em;
}
.sider nav { padding: 8px; display: flex; flex-direction: column; gap: 1px; flex: 1; }
.sider .group-label {
  padding: 14px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--color-fg-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-radius: 6px;
  color: var(--color-fg-2);
  font-size: 14px;
  cursor: pointer;
  border: 0;
  background: transparent;
  text-align: left;
  width: 100%;
  font-family: inherit;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.nav-item .ic { width: 16px; height: 16px; color: var(--color-fg-3); flex-shrink: 0; }
.nav-item:hover { background: var(--color-bg-subtle); color: var(--color-fg-1); }
.nav-item:hover .ic { color: var(--color-fg-2); }
.nav-item.active { background: var(--color-primary-bg); color: var(--color-primary-press); font-weight: 500; }
.nav-item.active .ic { color: var(--color-primary); }
.nav-item .badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--color-danger-bg);
  color: var(--color-danger);
  border: 1px solid var(--color-danger-border);
}

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: var(--layout-header-h);
  background: var(--color-bg-surface);
  border-bottom: 1px solid var(--color-border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.topbar .store-select {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--color-border);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  color: var(--color-fg-1);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.topbar .store-select:hover { border-color: var(--color-border-strong); }
.topbar .store-select .ic { width: 14px; height: 14px; color: var(--color-fg-3); }
.topbar .spacer { flex: 1; }
.topbar .user-block { display: flex; align-items: center; gap: 12px; }
.topbar .user-block .name { font-size: 14px; color: var(--color-fg-1); }

.content { padding: var(--layout-content-pad); flex: 1; overflow: auto; }
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.page-header h1 {
  font-size: 24px;
  font-weight: 600;
  color: var(--color-fg-1);
  letter-spacing: -0.011em;
  margin: 0;
  line-height: 1.2;
}
.page-header .spacer { flex: 1; }

/* Tag =========================================================== */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
  border: 1px solid;
  font-family: var(--font-sans);
  white-space: nowrap;
}
.tag-default { background: var(--color-neutral-bg); color: var(--color-fg-2); border-color: var(--color-neutral-border); }
.tag-success { background: var(--color-success-bg); color: #15803D; border-color: var(--color-success-border); }
.tag-danger  { background: var(--color-danger-bg);  color: #B91C1C; border-color: var(--color-danger-border); }
.tag-warning { background: var(--color-warning-bg); color: #B45309; border-color: var(--color-warning-border); }
.tag-info    { background: var(--color-info-bg);    color: #1B4BAD; border-color: var(--color-info-border); }
.tag-admin   { background: var(--color-role-admin-bg);   color: #1B4BAD; border-color: var(--color-info-border); }
.tag-cashier { background: var(--color-role-cashier-bg); color: #0E7C57; border-color: #A7E3CB; }

/* Button ======================================================== */
.btn {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--color-fg-1);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  line-height: 1.4;
  transition: background var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              box-shadow var(--dur-fast) var(--ease-out);
}
.btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.btn { white-space: nowrap; }
.btn .ic { width: 14px; height: 14px; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { background: var(--color-primary-press); }
.btn-default { background: #fff; color: var(--color-fg-1); border-color: var(--color-border); }
.btn-default:hover { border-color: var(--color-primary); color: var(--color-primary); }
.btn-ghost { background: transparent; color: var(--color-fg-2); }
.btn-ghost:hover { background: var(--color-bg-subtle); color: var(--color-fg-1); }
.btn-danger { background: #fff; color: var(--color-danger); border-color: var(--color-danger-border); }
.btn-danger:hover { background: var(--color-danger); color: #fff; border-color: var(--color-danger); }
.btn-lg { padding: 9px 18px; font-size: 15px; }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.btn-icon { padding: 6px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Input ========================================================= */
.input-wrap { position: relative; display: inline-flex; align-items: center; }
.input {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: #fff;
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--color-fg-1);
  width: 100%;
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.input::placeholder { color: var(--color-fg-4); }
.input:hover { border-color: var(--color-border-strong); }
.input:focus { border-color: var(--color-primary); box-shadow: var(--shadow-focus); }
.input-lg { height: 40px; font-size: 15px; }
.input-icon { position: relative; display: flex; align-items: center; width: 100%; }
.input-icon .input { padding-left: 36px; }
.input-icon .ic { position: absolute; left: 12px; width: 14px; height: 14px; color: var(--color-fg-4); pointer-events: none; }

/* Card ========================================================= */
.card {
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--dur-base) var(--ease-out);
}
.card-pad { padding: 20px 24px; }
.card-hoverable:hover { box-shadow: var(--shadow-md); }

/* Stat ========================================================= */
.stat { padding: 18px 22px; }
.stat-label { color: var(--color-fg-3); font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
.stat-label .ic { width: 16px; height: 16px; color: var(--color-fg-4); }
.stat-value {
  margin-top: 8px;
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.011em;
  color: var(--color-fg-1);
  line-height: 1.1;
}
.stat-value.pos { color: var(--color-success); }
.stat-value.neg { color: var(--color-danger); }
.stat-suffix { font-size: 18px; color: inherit; opacity: 0.9; }

/* Table ========================================================= */
.tbl-wrap {
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.tbl { width: 100%; border-collapse: collapse; font-family: var(--font-sans); font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl thead th { background: #F8FAFC; color: var(--color-fg-3); font-weight: 500; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--color-border); font-size: 12px; }
.tbl tbody td { padding: 11px 14px; border-bottom: 1px solid var(--color-border-subtle); color: var(--color-fg-2); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background var(--dur-fast) var(--ease-out); }
.tbl tbody tr:hover { background: var(--color-bg-subtle); }
.tbl .name { color: var(--color-fg-1); font-weight: 500; }
.tbl .right { text-align: right; }
.tbl .num { font-variant-numeric: tabular-nums; }
.tbl .actions { display: flex; gap: 6px; justify-content: flex-end; }

/* Misc ========================================================= */
.row { display: flex; gap: 12px; align-items: center; }
.col { display: flex; flex-direction: column; }
.divider { height: 1px; background: var(--color-border-subtle); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--color-fg-3); }
.numeric { font-variant-numeric: tabular-nums; }

/* Modal ========================================================= */
.modal-scrim {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: var(--z-modal);
  animation: scrim-in var(--dur-slow) var(--ease-out);
}
@keyframes scrim-in { from { opacity: 0 } to { opacity: 1 } }
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  width: 460px;
  max-width: calc(100% - 32px);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: modal-in var(--dur-slow) var(--ease-out);
}
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.modal-head { padding: 14px 20px; border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: center; justify-content: space-between; }
.modal-head .title { font-size: 15px; font-weight: 600; color: var(--color-fg-1); }
.modal-body { padding: 16px 20px; }
.modal-foot { padding: 12px 20px; border-top: 1px solid var(--color-border-subtle); background: var(--color-bg-subtle); display: flex; justify-content: flex-end; gap: 8px; }

/* Sales register layout ========================================== */
.sales-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
.cart-empty { padding: 48px 0; text-align: center; color: var(--color-fg-3); font-size: 14px; }
.cart-table-wrap { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.totals-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.totals-row.total { font-size: 18px; font-weight: 600; color: var(--color-fg-1); padding-top: 8px; border-top: 1px solid var(--color-border-subtle); margin-top: 8px; }
.qty-input { width: 56px; padding: 4px 8px; height: 28px; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; border: 1px solid var(--color-border); border-radius: 4px; background: #fff; }
.qty-input:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-focus); }
.customer-chip { background: var(--color-success-bg); border: 1px solid var(--color-success-border); border-radius: 6px; padding: 8px 12px; margin: 10px 0; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.customer-chip .name { color: var(--color-fg-1); font-weight: 600; }
.customer-chip .remove { margin-left: auto; background: transparent; border: 0; color: var(--color-danger); cursor: pointer; font-size: 14px; line-height: 1; }

/* Toast =========================================================== */
.toast-stack { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: var(--z-toast); }
.toast { background: var(--color-bg-inverse); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 13px; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 8px; min-width: 220px; animation: toast-in var(--dur-base) var(--ease-out); }
@keyframes toast-in { from { opacity: 0; transform: translateX(8px) } to { opacity: 1; transform: none } }
.toast .ic { width: 14px; height: 14px; }
.toast.success .ic { color: #4ADE80; }
.toast.error .ic { color: #FCA5A5; }

/* Search popup ==================================================== */
.search-popup {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  z-index: 50;
  max-height: 280px;
  overflow: auto;
}
.search-popup .item { padding: 8px 12px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--color-border-subtle); }
.search-popup .item:last-child { border-bottom: 0; }
.search-popup .item:hover { background: var(--color-bg-subtle); }
.search-popup .item .name { color: var(--color-fg-1); flex: 1; }
.search-popup .item .price { color: var(--color-fg-2); }
.search-popup .item .stock { font-size: 12px; color: var(--color-fg-3); }
.search-popup .item .stock.low { color: var(--color-danger); }

  
/* ====== PRINT MODE ====== */
@page { size: 1440px 1024px; margin: 0; }
html, body { background: #F4F6FA; }
.print-page {
  width: 1440px;
  height: 1024px;
  background: var(--color-bg-app);
  overflow: hidden;
  page-break-after: always;
  break-after: page;
  position: relative;
}
.print-page:last-child { page-break-after: auto; break-after: auto; }
.print-app { min-height: 1024px; height: 1024px; }
.print-app .content { overflow: hidden; }

/* Disable hover/animations for stable print capture */
.print-app *,
.print-app *::before,
.print-app *::after {
  animation: none !important;
  transition: none !important;
}
/* Strip persistent hover-shadow on rows */
.print-app .tbl tbody tr:hover { background: transparent !important; }

/* Browser print rules */
@media print {
  html, body { margin: 0 !important; padding: 0 !important; }
  body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .print-page {
    box-shadow: none;
    page-break-after: always;
    break-after: page;
  }
  .print-page:last-child { page-break-after: auto; break-after: auto; }
}

// Primitives: Button, Tag, TextInput, Card, Stat

const Button = ({ children, variant = 'default', size, icon, onClick, type = 'button', disabled, style }) => {
  const cls = ['btn', `btn-${variant}`, size === 'lg' ? 'btn-lg' : size === 'sm' ? 'btn-sm' : '', icon && !children ? 'btn-icon' : ''].filter(Boolean).join(' ');
  return (
    <button type={type} className={cls} onClick={onClick} disabled={disabled} style={style}>
      {icon}
      {children}
    </button>
  );
};

const Tag = ({ children, variant = 'default' }) => (
  <span className={`tag tag-${variant}`}>{children}</span>
);

const TextInput = ({ value, onChange, placeholder, icon, size, type = 'text', maxLength, autoFocus, onKeyDown }) => {
  if (icon) {
    return (
      <div className="input-icon">
        {icon}
        <input className={`input ${size === 'lg' ? 'input-lg' : ''}`}
          value={value ?? ''} onChange={(e) => onChange?.(e.target.value)}
          placeholder={placeholder} type={type} maxLength={maxLength}
          autoFocus={autoFocus} onKeyDown={onKeyDown}/>
      </div>
    );
  }
  return (
    <input className={`input ${size === 'lg' ? 'input-lg' : ''}`}
      value={value ?? ''} onChange={(e) => onChange?.(e.target.value)}
      placeholder={placeholder} type={type} maxLength={maxLength}
      autoFocus={autoFocus} onKeyDown={onKeyDown}/>
  );
};

const Card = ({ children, pad = true, hoverable, style }) => (
  <div className={`card ${pad ? 'card-pad' : ''} ${hoverable ? 'card-hoverable' : ''}`} style={style}>
    {children}
  </div>
);

  <Card pad={false}>
    <div className="stat">
      <div className="stat-label"><span>{label}</span>{icon}</div>
      <div className={`stat-value ${tone === 'pos' ? 'pos' : tone === 'neg' ? 'neg' : ''}`}>
        {value}{suffix && <span className="stat-suffix">&nbsp;{suffix}</span>}
      </div>

  </Card>
);

const Modal = ({ open, title, onClose, children, footer, width = 460 }) => {
  if (!open) return null;
  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className="modal" style={{ width }} onClick={(e) => e.stopPropagation()}>

        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}

    </div>
  );
};

const TopBar = ({ role, onToggleRole, activeStore, stores, onChangeStore, user, onLogout }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const click = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', click);
    return () => document.removeEventListener('mousedown', click);
  }, []);
  return (
    <header className="topbar">
      <div ref={ref} style={{ position: 'relative' }}>
        <button className="store-select" onClick={() => setOpen(!open)}>
          <IconStore className="ic" size={14}/>

                <IconStore size={12} className="ic"/>{s}

      <div className="user-block">

      </div>
    </header>
  );
};

  const [payType, setPayType] = React.useState('cash');
  const [cashGiven, setCashGiven] = React.useState(0);

  const onSearch = (v) => {
    setSearch(v);
    if (!v) { setResults([]); return; }
    setResults(CATALOG.filter((p) =>
      p.name.toLowerCase().includes(v.toLowerCase()) ||
      (p.article || '').toLowerCase().includes(v.toLowerCase())
    ).slice(0, 6));
  };

  const addToCart = (p) => {
    if (p.stock === 0) { pushToast('Товар недоступен — нет в наличии', 'error'); return; }
    setCart((c) => {
      const ex = c.find((i) => i.id === p.id);
      if (ex) {
        if (ex.qty >= p.stock) { pushToast(`Доступно только ${p.stock} шт`, 'error'); return c; }
        return c.map((i) => i.id === p.id ? { ...i, qty: i.qty + 1 } : i);
      }
      return [...c, { ...p, qty: 1 }];
    });
    setSearch('');
    setResults([]);
  };

  const setQty = (id, q) => {
    if (q <= 0) { setCart((c) => c.filter((i) => i.id !== id)); return; }
    setCart((c) => c.map((i) => i.id === id ? { ...i, qty: Math.min(q, i.stock) } : i));
  };

  const onPhone = (v) => {
    setPhone(v);
    const digits = v.replace(/\D/g, '');
    if (digits.length < 3) { setPhoneResults([]); return; }
    setPhoneResults(CUSTOMERS.filter((c) => c.phone.replace(/\D/g, '').includes(digits)));
  };

  const pickCustomer = (c) => { setCustomer(c); setPhone(''); setPhoneResults([]); };
  const clearCustomer = () => setCustomer(null);

  const subtotal = cart.reduce((s, i) => s + i.qty * i.price, 0);
  const discount = customer ? customer.discount : 0;
  const discountAmt = subtotal * (discount / 100);
  const total = subtotal - discountAmt;

  const openPay = () => {
    if (!cart.length) { pushToast('Добавьте товары в корзину', 'error'); return; }
    setCashGiven(Math.round(total * 100) / 100);

    setPayOpen(true);

  const submitSale = () => {
    setPayOpen(false);
    setCart([]);
    setCustomer(null);

                <tbody>
                  {cart.map((i) => (

                      <td className="right mono">{fmt(i.price)}&nbsp;₽</td>

                      <td className="right">

            <div style={{ position: 'relative', marginTop: 8 }}>

              {phoneResults.length > 0 && (
                <div className="search-popup">

                    <div key={c.id} className="item" onClick={() => pickCustomer(c)}>
                      <span className="name">{c.last} {c.first}</span>

                <Tag variant="success">{customer.status} · {customer.discount}%</Tag>

            {discount > 0 && (

            <div className="totals-row total"><span>Итого:</span><span className="numeric">{fmt(total)}&nbsp;₽</span></div>

            <Button variant="primary" size="lg" onClick={openPay} style={{ width: '100%', marginTop: 20, justifyContent: 'center' }}>Оформить оплату</Button>

          </Card>
        </div>
      </div>

      <Modal open={payOpen} title="Оплата" onClose={() => setPayOpen(false)} width={420}
        footer={<>
          <Button variant="default" onClick={() => setPayOpen(false)}>Отмена</Button>
          <Button variant="primary" onClick={submitSale} disabled={payType === 'cash' && !enough}>Провести продажу</Button>
        </>}>
        <div className="muted" style={{ fontSize: 12 }}>К оплате</div>
        <div style={{
          fontFamily: 'var(--font-display)', fontSize: 32, fontWeight: 600,
          color: 'var(--color-fg-1)', fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.011em',
          marginBottom: 16,
        }}>{fmt(total)}&nbsp;₽</div>

        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--color-fg-3)', letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: 8 }}>Способ оплаты</div>

                  borderColor: payType === k ? 'var(--color-primary)' : 'var(--color-border)',

                  fontWeight: payType === k ? 500 : 400,
                }}>{l}</button>
            ))}
          </div>
        </div>

        {payType === 'cash' && (
          <>

  );
};

          onChangeStore={setStore}
          user={role === 'admin' ? 'Петров А.' : 'Сидорова М.'}
          onLogout={() => pushToast('Сессия завершена')}
        />
        <main className="content">{renderScreen()}</main>
      </div>
      <div className="toast-stack">
        {toasts.map((t) => <Toast key={t.id} tone={t.tone}>{t.msg}</Toast>)}
      </div>
    </div>
  );
};

const PrintApp = () => {
  const stores = ['Магазин «Центральный»', 'Магазин «Северный»', 'Магазин «Южный»'];
  const noop = () => {};
  const Page = ({ screenKey, role, screen }) => (
    <div className="print-page">
      <div className="app print-app">
        <Sidebar active={screenKey} onNavigate={noop} role={role} lowStockCount={4}/>
        <div className="main">
          <TopBar role={role} onToggleRole={noop}
            activeStore={stores[0]} stores={stores} onChangeStore={noop}
            user={role === 'admin' ? 'Петров А.' : 'Сидорова М.'} onLogout={noop}/>
          <main className="content">{screen}</main>
        </div>
      </div>
    </div>
  );
  return (
    <>
      <Page screenKey="dashboard" role="admin" screen={<Dashboard/>}/>
      <Page screenKey="sales"     role="admin" screen={<Sales pushToast={noop}/>}/>
      <Page screenKey="products"  role="admin" screen={<Products pushToast={noop}/>}/>
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PrintApp/>);

// Auto-print once fonts + render settle
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  await new Promise((r) => setTimeout(r, 700));
  window.print();
})();

  </script>
</body>
</html>
