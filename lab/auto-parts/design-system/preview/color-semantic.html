<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
    <div style="border:1px solid #BBF7D0;background:#ECFDF5;border-radius:8px;padding:12px">
      <div style="font-size:12px;font-weight:600;color:#15803D;letter-spacing:.04em;text-transform:uppercase">Success</div>
      <div style="margin-top:8px;color:#16A34A;font-weight:600;font-size:14px">В норме</div>
      <div class="mono" style="color:#15803D;margin-top:6px">#16A34A</div>
    </div>
    <div style="border:1px solid #FECACA;background:#FEF2F2;border-radius:8px;padding:12px">
      <div style="font-size:12px;font-weight:600;color:#B91C1C;letter-spacing:.04em;text-transform:uppercase">Danger</div>
      <div style="margin-top:8px;color:#DC2626;font-weight:600;font-size:14px">Мало</div>
      <div class="mono" style="color:#B91C1C;margin-top:6px">#DC2626</div>
    </div>
    <div style="border:1px solid #FED7AA;background:#FFFBEB;border-radius:8px;padding:12px">
      <div style="font-size:12px;font-weight:600;color:#B45309;letter-spacing:.04em;text-transform:uppercase">Warning</div>
      <div style="margin-top:8px;color:#D97706;font-weight:600;font-size:14px">На проверке</div>
      <div class="mono" style="color:#B45309;margin-top:6px">#D97706</div>
    </div>
    <div style="border:1px solid #BCD3FA;background:#EAF1FE;border-radius:8px;padding:12px">
      <div style="font-size:12px;font-weight:600;color:#1B4BAD;letter-spacing:.04em;text-transform:uppercase">Info</div>
      <div style="margin-top:8px;color:#2D6CDF;font-weight:600;font-size:14px">Проведено</div>
      <div class="mono" style="color:#1B4BAD;margin-top:6px">#2D6CDF</div>
    </div>
  </div>
</div>
</body></html>
