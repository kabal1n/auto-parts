<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
    <div>
      <div style="height:64px;background:#2D6CDF;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Primary</div>
      <div class="mono" style="color:var(--color-fg-3)">#2D6CDF</div>
    </div>
    <div>
      <div style="height:64px;background:#245CC6;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Hover</div>
      <div class="mono" style="color:var(--color-fg-3)">#245CC6</div>
    </div>
    <div>
      <div style="height:64px;background:#1B4BAD;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Press</div>
      <div class="mono" style="color:var(--color-fg-3)">#1B4BAD</div>
    </div>
    <div>
      <div style="height:64px;background:#EAF1FE;border:1px solid #BCD3FA;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Subtle bg</div>
      <div class="mono" style="color:var(--color-fg-3)">#EAF1FE</div>
    </div>
    <div>
      <div style="height:64px;background:#BCD3FA;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Border</div>
      <div class="mono" style="color:var(--color-fg-3)">#BCD3FA</div>
    </div>
  </div>
</div>
</body></html>
