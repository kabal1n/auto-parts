<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
    <div>
      <div style="height:64px;background:#1F8A5B;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Primary</div>
      <div class="mono" style="color:var(--color-fg-3)">#1F8A5B</div>
    </div>
    <div>
      <div style="height:64px;background:#176E48;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Hover</div>
      <div class="mono" style="color:var(--color-fg-3)">#176E48</div>
    </div>
    <div>
      <div style="height:64px;background:#0F5535;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Press</div>
      <div class="mono" style="color:var(--color-fg-3)">#0F5535</div>
    </div>
    <div>
      <div style="height:64px;background:#ECF7F1;border:1px solid #B7DDC7;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Subtle bg</div>
      <div class="mono" style="color:var(--color-fg-3)">#ECF7F1</div>
    </div>
    <div>
      <div style="height:64px;background:#B7DDC7;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:13px;font-weight:600;color:var(--color-fg-1)">Border</div>
      <div class="mono" style="color:var(--color-fg-3)">#B7DDC7</div>
    </div>
  </div>
</div>
</body></html>
