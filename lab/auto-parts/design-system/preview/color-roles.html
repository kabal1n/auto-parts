<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
    <div>
      <div class="label" style="margin-bottom:10px">Administrator</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;background:#EAF1FE;color:#1B4BAD;border:1px solid #BCD3FA;border-radius:4px;font-size:12px;font-weight:500">Администратор</span>
        <span style="color:var(--color-fg-3);font-size:13px">Полный доступ</span>
      </div>
      <div style="background:#EAF1FE;border-left:3px solid #2D6CDF;padding:8px 12px;border-radius:0 6px 6px 0">
        <div style="font-size:13px;color:var(--color-fg-1);font-weight:500">Активная навигация</div>
        <div class="mono" style="color:#1B4BAD;margin-top:2px">bg #EAF1FE · fg #2D6CDF</div>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:10px">Cashier</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;background:#E6F7EF;color:#0E7C57;border:1px solid #A7E3CB;border-radius:4px;font-size:12px;font-weight:500">Кассир</span>
        <span style="color:var(--color-fg-3);font-size:13px">Один магазин</span>
      </div>
      <div style="background:#E6F7EF;border-left:3px solid #0E9F6E;padding:8px 12px;border-radius:0 6px 6px 0">
        <div style="font-size:13px;color:var(--color-fg-1);font-weight:500">Кассовая смена</div>
        <div class="mono" style="color:#0E7C57;margin-top:2px">bg #E6F7EF · fg #0E9F6E</div>
      </div>
    </div>
  </div>
</div>
</body></html>
