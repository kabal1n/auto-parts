<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
    <div>
      <div class="label" style="margin-bottom:10px">Administrator</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;background:#ECF7F1;color:#0F5535;border:1px solid #B7DDC7;border-radius:4px;font-size:12px;font-weight:500">Администратор</span>
        <span style="color:var(--color-fg-3);font-size:13px">Полный доступ</span>
      </div>
      <div style="background:#ECF7F1;border-left:3px solid #1F8A5B;padding:8px 12px;border-radius:0 6px 6px 0">
        <div style="font-size:13px;color:var(--color-fg-1);font-weight:500">Активная навигация</div>
        <div class="mono" style="color:#0F5535;margin-top:2px">bg #ECF7F1 · fg #1F8A5B</div>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:10px">Cashier</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;background:#F1F5F9;color:#334155;border:1px solid #CBD5E1;border-radius:4px;font-size:12px;font-weight:500">Кассир</span>
        <span style="color:var(--color-fg-3);font-size:13px">Один магазин</span>
      </div>
      <div style="background:#F1F5F9;border-left:3px solid #475569;padding:8px 12px;border-radius:0 6px 6px 0">
        <div style="font-size:13px;color:var(--color-fg-1);font-weight:500">Кассовая смена</div>
        <div class="mono" style="color:#334155;margin-top:2px">bg #F1F5F9 · fg #475569</div>
      </div>
    </div>
  </div>
</div>
</body></html>
