<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.tbl { width:100%; border-collapse:collapse; font-family:var(--font-sans); font-size:13px; background:#fff; border:1px solid var(--color-border); border-radius:8px; overflow:hidden; font-variant-numeric:tabular-nums }
.tbl thead th { background:#F8FAFC; color:var(--color-fg-3); font-weight:500; text-align:left; padding:10px 14px; border-bottom:1px solid var(--color-border); font-size:12px }
.tbl tbody td { padding:10px 14px; border-bottom:1px solid var(--color-border-subtle); color:var(--color-fg-2); vertical-align:middle }
.tbl tbody tr:last-child td { border-bottom:0 }
.tbl tbody tr.hov td { background:#F8FAFC }
.tbl .name { color:var(--color-fg-1); font-weight:500 }
.tag { display:inline-flex; align-items:center; padding:2px 9px; border-radius:4px; font-size:12px; font-weight:500; border:1px solid; line-height:1.5 }
.right { text-align:right }
</style></head>
<body>
<div class="card">
  <table class="tbl">
    <thead><tr><th>Товар</th><th>Артикул</th><th style="width:90px" class="right">Остаток</th><th style="width:80px" class="right">Цена</th><th style="width:110px">Статус</th></tr></thead>
    <tbody>
      <tr><td class="name">Колодка ATE 13.0460-7308.2</td><td>AP-0042</td><td class="right">12</td><td class="right">1&nbsp;284,50</td><td><span class="tag" style="background:#ECFDF5;color:#15803D;border-color:#BBF7D0">В норме</span></td></tr>
      <tr class="hov"><td class="name">Фильтр масляный MANN W&nbsp;712/52</td><td>AP-0118</td><td class="right">3</td><td class="right">489,00</td><td><span class="tag" style="background:#FEF2F2;color:#B91C1C;border-color:#FECACA">Мало</span></td></tr>
      <tr><td class="name">Свеча NGK BPR6ES</td><td>AP-0231</td><td class="right">1&nbsp;204</td><td class="right">352,90</td><td><span class="tag" style="background:#ECFDF5;color:#15803D;border-color:#BBF7D0">В норме</span></td></tr>
      <tr><td class="name">Антифриз Felix Carbox -40 5л</td><td>AP-0507</td><td class="right">0</td><td class="right">980,00</td><td><span class="tag" style="background:#FEF2F2;color:#B91C1C;border-color:#FECACA">Мало</span></td></tr>
    </tbody>
  </table>
</div>
</body></html>
