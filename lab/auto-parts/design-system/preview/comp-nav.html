<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.nav { background:#fff; border:1px solid var(--color-border); border-radius:8px; padding:8px; width:220px; font-family:var(--font-sans); font-size:14px }
.nav .brand { padding: 8px 12px 14px; border-bottom: 1px solid var(--color-border-subtle); margin-bottom: 6px; display:flex; align-items:center; gap:8px }
.nav .brand .mark { width:18px; height:18px; }
.nav .brand .name { font-weight:600; color:var(--color-fg-1); font-size:15px; letter-spacing:-0.005em }
.nav .item { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:6px; color:var(--color-fg-2); cursor:default; transition: background .12s, color .12s; }
.nav .item:hover { background:#F8FAFC; color:var(--color-fg-1) }
.nav .item.active { background:#EAF1FE; color:#1B4BAD; font-weight:500 }
.nav .item.active svg { color:#2D6CDF }
.nav .item svg { color:var(--color-fg-3); width:16px; height:16px; flex-shrink:0 }
.nav .item.active svg { color:#2D6CDF }
</style></head>
<body>
<div class="card" style="background:#F4F6FA;padding:14px;border:none">
  <div style="display:flex;gap:18px;align-items:flex-start">
    <nav class="nav">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#2D6CDF" stroke-width="2"/><circle cx="16" cy="16" r="4.5" fill="#2D6CDF"/></svg><span class="name">АвтоЗапчасти</span></div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg>Главная</div>
      <div class="item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>Касса / Продажа</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Товары</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/></svg>Остатки</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Клиенты</div>
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Заказы клиентов</div>
    </nav>
    <div style="flex:1;color:var(--color-fg-3);font-size:12px;line-height:1.6;padding-top:6px">
      <div style="font-size:11px;font-weight:600;color:var(--color-fg-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px">Navigation</div>
      <p style="margin:0">232 px sider · white surface · hairline-right border. Active item: <span class="mono">bg #EAF1FE / fg #1B4BAD</span>. Hover: <span class="mono">bg #F8FAFC</span>. Items are filtered by role — admin sees all 13, cashier sees 8.</p>
    </div>
  </div>
</div>
</body></html>
