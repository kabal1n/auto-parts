<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="background:#F4F6FA">
<div class="card" style="background:#F4F6FA;border:none;padding:0">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 4px">
    <div style="background:#fff;border:1px solid var(--color-border);border-radius:8px;padding:18px 20px;box-shadow:0 2px 8px rgba(15,23,42,0.06)">

      </div>
      <div style="margin-top:8px;font-family:'IBM Plex Sans';font-size:30px;font-weight:600;color:var(--color-fg-1);font-variant-numeric:tabular-nums;letter-spacing:-0.011em">42</div>
    </div>
    <div style="background:#fff;border:1px solid var(--color-border);border-radius:8px;padding:18px 20px;box-shadow:0 2px 8px rgba(15,23,42,0.06)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><span style="color:var(--color-fg-3);font-size:13px">Выручка сегодня</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
      <div style="margin-top:8px;font-family:'IBM Plex Sans';font-size:30px;font-weight:600;color:#16A34A;font-variant-numeric:tabular-nums;letter-spacing:-0.011em">128&nbsp;540&nbsp;<span style="font-size:18px;color:#16A34A">₽</span></div>
    </div>
    <div style="background:#fff;border:1px solid var(--color-border);border-radius:8px;padding:18px 20px;box-shadow:0 2px 8px rgba(15,23,42,0.06)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><span style="color:var(--color-fg-3);font-size:13px">Наличными</span><span style="color:var(--color-fg-3);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase">Касса 2</span></div>

    </div>
    <div style="background:#fff;border:1px solid var(--color-border);border-radius:8px;padding:18px 20px;box-shadow:0 2px 8px rgba(15,23,42,0.06)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><span style="color:var(--color-fg-3);font-size:13px">Дефицит товаров</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

      <div style="margin-top:8px;font-family:'IBM Plex Sans';font-size:30px;font-weight:600;color:#DC2626;font-variant-numeric:tabular-nums;letter-spacing:-0.011em">7</div>
    </div>
  </div>
</div>
</body></html>
