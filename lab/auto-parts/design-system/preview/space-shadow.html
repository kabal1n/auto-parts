<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="background:#F4F6FA">
<div class="card" style="background:#F4F6FA;border:none">
  <div class="label" style="margin-bottom:4px;color:var(--color-fg-3)">Elevation — single-axis, subtle</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:16px 4px 24px">
    <div style="background:#fff;border:1px solid #E1E6EF;border-radius:8px;padding:18px 14px;box-shadow:0 1px 2px rgba(15,23,42,0.04)">
      <div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">xs</div>
      <div class="mono" style="color:var(--color-fg-3);margin-top:4px">0&nbsp;1&nbsp;2&nbsp;/&nbsp;.04</div>
      <div style="font-size:11px;color:var(--color-fg-3);margin-top:8px">Chip on card</div>
    </div>
    <div style="background:#fff;border:1px solid #E1E6EF;border-radius:8px;padding:18px 14px;box-shadow:0 2px 8px rgba(15,23,42,0.06)">
      <div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">sm</div>
      <div class="mono" style="color:var(--color-fg-3);margin-top:4px">0&nbsp;2&nbsp;8&nbsp;/&nbsp;.06</div>
      <div style="font-size:11px;color:var(--color-fg-3);margin-top:8px">Card resting</div>
    </div>
    <div style="background:#fff;border:1px solid #E1E6EF;border-radius:8px;padding:18px 14px;box-shadow:0 4px 16px rgba(15,23,42,0.08)">
      <div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">md</div>
      <div class="mono" style="color:var(--color-fg-3);margin-top:4px">0&nbsp;4&nbsp;16&nbsp;/&nbsp;.08</div>
      <div style="font-size:11px;color:var(--color-fg-3);margin-top:8px">Hover, dropdown</div>
    </div>
    <div style="background:#fff;border:1px solid #E1E6EF;border-radius:8px;padding:18px 14px;box-shadow:0 12px 32px rgba(15,23,42,0.10)">
      <div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">lg</div>
      <div class="mono" style="color:var(--color-fg-3);margin-top:4px">0&nbsp;12&nbsp;32&nbsp;/&nbsp;.10</div>
      <div style="font-size:11px;color:var(--color-fg-3);margin-top:8px">Modal</div>
    </div>
  </div>
</div>
</body></html>
