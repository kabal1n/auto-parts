<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body style="background:#F4F6FA">
<div class="card" style="background:#F4F6FA;border:none;padding:18px 4px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start">
    <div style="background:#fff;border:1px solid var(--color-border);border-radius:8px;padding:18px 20px;box-shadow:0 2px 8px rgba(15,23,42,0.06)">
      <div style="font-size:11px;font-weight:600;color:var(--color-fg-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px">Клиент</div>
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <div style="font-size:15px;font-weight:600;color:var(--color-fg-1)">Иванов Сергей</div>
          <div class="mono" style="color:var(--color-fg-3);margin-top:2px">+7&nbsp;(916)&nbsp;234-56-78</div>
        </div>
        <span style="display:inline-flex;padding:2px 9px;background:#ECFDF5;color:#15803D;border:1px solid #BBF7D0;border-radius:4px;font-size:12px;font-weight:500">VIP · 10%</span>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--color-border-subtle);display:flex;gap:14px;font-size:12px">
        <div><div style="color:var(--color-fg-3)">Авто</div><div style="color:var(--color-fg-1);font-weight:500;margin-top:2px">Volkswagen Passat B7</div></div>
        <div><div style="color:var(--color-fg-3)">VIN</div><div class="mono" style="color:var(--color-fg-1);margin-top:2px">WVWZZZ3CZAE···</div></div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid var(--color-border);border-radius:10px;padding:0;box-shadow:0 12px 32px rgba(15,23,42,.10);overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--color-border-subtle);display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:15px;font-weight:600;color:var(--color-fg-1)">Оплата</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div style="padding:14px 18px">
        <div style="font-size:12px;color:var(--color-fg-3)">К оплате</div>
        <div style="font-family:'IBM Plex Sans';font-size:28px;font-weight:600;color:var(--color-fg-1);font-variant-numeric:tabular-nums;letter-spacing:-0.011em">2&nbsp;126,40&nbsp;<span style="font-size:16px;color:var(--color-fg-3)">₽</span></div>
        <div style="margin-top:12px;display:flex;gap:6px">
          <span style="padding:5px 12px;border:1px solid #2D6CDF;background:#EAF1FE;color:#1B4BAD;border-radius:6px;font-size:13px;font-weight:500">Наличные</span>
          <span style="padding:5px 12px;border:1px solid var(--color-border);background:#fff;color:var(--color-fg-2);border-radius:6px;font-size:13px">Карта</span>
          <span style="padding:5px 12px;border:1px solid var(--color-border);background:#fff;color:var(--color-fg-2);border-radius:6px;font-size:13px">Смешанная</span>
        </div>
      </div>
      <div style="padding:12px 18px;border-top:1px solid var(--color-border-subtle);background:#F8FAFC;display:flex;justify-content:flex-end;gap:8px">
        <button style="padding:6px 14px;border:1px solid var(--color-border);background:#fff;color:var(--color-fg-1);border-radius:6px;font-size:13px;font-family:var(--font-sans)">Отмена</button>
        <button style="padding:6px 14px;border:0;background:#2D6CDF;color:#fff;border-radius:6px;font-size:13px;font-weight:500;font-family:var(--font-sans)">Провести продажу</button>
      </div>
    </div>
  </div>
</div>
</body></html>
