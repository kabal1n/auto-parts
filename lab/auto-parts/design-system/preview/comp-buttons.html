<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.btn { font-family: var(--font-sans); font-size: 14px; font-weight: 500; padding: 7px 16px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; transition: background .12s, border .12s, color .12s, box-shadow .12s; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
.btn-primary { background: #2D6CDF; color: #fff; }
.btn-primary.hover { background: #245CC6; }
.btn-primary.press { background: #1B4BAD; }
.btn-default { background: #fff; color: var(--color-fg-1); border-color: #E1E6EF; }
.btn-default.hover { border-color: #2D6CDF; color: #2D6CDF; }
.btn-ghost { background: transparent; color: var(--color-fg-2); }
.btn-ghost.hover { background: #F1F5F9; }
.btn-danger { background: #fff; color: #DC2626; border-color: #FECACA; }
.btn-danger.hover { background: #DC2626; color: #fff; border-color: #DC2626; }
.btn-primary.focus { box-shadow: 0 0 0 3px rgba(45,108,223,.25); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.cap { font-size: 11px; color: var(--color-fg-3); text-align: center; margin-top: 4px; }
.lbl { font-size: 11px; font-weight:500; color: var(--color-fg-3); letter-spacing: .04em; text-transform: uppercase; }
</style></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:repeat(4,auto);gap:18px 22px;align-items:start;justify-items:start">
    <div class="lbl">Primary</div><div class="lbl">Default</div><div class="lbl">Ghost / text</div><div class="lbl">Danger</div>
    <div><button class="btn btn-primary">Войти</button><div class="cap">resting</div></div>
    <div><button class="btn btn-default">Отмена</button><div class="cap">resting</div></div>
    <div><button class="btn btn-ghost">Выйти</button><div class="cap">resting</div></div>
    <div><button class="btn btn-danger">Удалить</button><div class="cap">resting</div></div>
    <div><button class="btn btn-primary hover">Войти</button><div class="cap">hover</div></div>
    <div><button class="btn btn-default hover">Отмена</button><div class="cap">hover</div></div>
    <div><button class="btn btn-ghost hover">Выйти</button><div class="cap">hover</div></div>
    <div><button class="btn btn-danger hover">Удалить</button><div class="cap">hover</div></div>
    <div><button class="btn btn-primary focus">Войти</button><div class="cap">focus</div></div>
    <div><button class="btn btn-primary press">Войти</button><div class="cap">press</div></div>
    <div><button class="btn btn-primary" disabled>Войти</button><div class="cap">disabled</div></div>
    <div><button class="btn btn-primary"><span style="width:14px;height:14px;background:currentColor;-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222.5%22 stroke-linecap=%22round%22><line x1=%2212%22 y1=%225%22 x2=%2212%22 y2=%2219%22/><line x1=%225%22 y1=%2212%22 x2=%2219%22 y2=%2212%22/></svg>') center/contain no-repeat;mask:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22 stroke-width=%222.5%22 stroke-linecap=%22round%22><line x1=%2212%22 y1=%225%22 x2=%2212%22 y2=%2219%22/><line x1=%225%22 y1=%2212%22 x2=%2219%22 y2=%2212%22/></svg>') center/contain no-repeat"></span>Добавить</button><div class="cap">w/ icon</div></div>
  </div>
</div>
</body></html>
