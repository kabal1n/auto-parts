<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.field { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #E1E6EF; border-radius: 6px; background: #fff; font-family: var(--font-sans); font-size: 14px; color: var(--color-fg-1); display: flex; align-items: center; gap: 8px; box-sizing: border-box; transition: border .12s, box-shadow .12s; }
.field .placeholder { color: var(--color-fg-4); }
.field.focus { border-color: #1F8A5B; box-shadow: 0 0 0 3px rgba(31, 138, 91,.18); }
.field.error { border-color: #DC2626; box-shadow: 0 0 0 3px rgba(220,38,38,.15); }
.ic { width: 14px; height: 14px; color: var(--color-fg-4); flex-shrink: 0; }
.lbl { font-size: 12px; font-weight: 500; color: var(--color-fg-3); margin-bottom: 4px; display:block }
.err { font-size: 12px; color: #DC2626; margin-top: 4px; }
.chev { margin-left: auto; color: var(--color-fg-4); }
</style></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px 24px">
    <div>
      <label class="lbl">Логин</label>
      <div class="field"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="placeholder">Введите логин</span></div>
    </div>
    <div>
      <label class="lbl">Пароль · focus</label>
      <div class="field focus"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/></svg><span>••••••••</span></div>
    </div>
    <div>
      <label class="lbl">Поиск товара</label>
      <div class="field"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="placeholder">Название, артикул или штрих-код…</span></div>
    </div>
    <div>
      <label class="lbl">Категория · select</label>
      <div class="field"><span style="color:var(--color-fg-1)">Тормозная система</span><svg class="ic chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
    </div>
    <div>
      <label class="lbl">Сумма (₽)</label>
      <div class="field"><span style="color:var(--color-fg-1);font-variant-numeric:tabular-nums">1 284,50</span><span class="chev" style="font-family:var(--font-mono);font-size:12px">₽</span></div>
    </div>
    <div>
      <label class="lbl">Телефон · error</label>
      <div class="field error"><span style="color:var(--color-fg-1)">+7 (___) ___-__-__</span></div>
      <div class="err">Введите номер целиком</div>
    </div>
  </div>
</div>
</body></html>
