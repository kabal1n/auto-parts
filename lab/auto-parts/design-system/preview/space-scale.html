<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="label">Spacing scale · 4-px base</div>
    <div style="display:flex;align-items:flex-end;gap:14px;height:64px;margin-top:8px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:4px;height:4px;background:#1F8A5B;border-radius:1px"></div><span class="mono" style="color:var(--color-fg-3)">4</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:8px;height:8px;background:#1F8A5B;border-radius:1px"></div><span class="mono" style="color:var(--color-fg-3)">8</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:12px;height:12px;background:#1F8A5B;border-radius:2px"></div><span class="mono" style="color:var(--color-fg-3)">12</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:16px;background:#1F8A5B;border-radius:2px"></div><span class="mono" style="color:var(--color-fg-3)">16</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:20px;height:20px;background:#1F8A5B;border-radius:2px"></div><span class="mono" style="color:var(--color-fg-3)">20</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:24px;background:#1F8A5B;border-radius:3px"></div><span class="mono" style="color:var(--color-fg-3)">24</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:32px;height:32px;background:#1F8A5B;border-radius:3px"></div><span class="mono" style="color:var(--color-fg-3)">32</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:40px;height:40px;background:#1F8A5B;border-radius:4px"></div><span class="mono" style="color:var(--color-fg-3)">40</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:48px;height:48px;background:#1F8A5B;border-radius:4px"></div><span class="mono" style="color:var(--color-fg-3)">48</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:64px;height:64px;background:#1F8A5B;border-radius:4px"></div><span class="mono" style="color:var(--color-fg-3)">64</span></div>
    </div>
  </div>
</div>
</body></html>
