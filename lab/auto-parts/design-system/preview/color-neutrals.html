<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div>
      <div class="label" style="margin-bottom:10px">Foreground</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#0F172A;border-radius:4px"></span><span style="color:#0F172A;font-weight:600;flex:1">fg-1 · Headings, numerals</span><span class="mono" style="color:var(--color-fg-3)">#0F172A</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#334155;border-radius:4px"></span><span style="color:#334155;flex:1">fg-2 · Body text</span><span class="mono" style="color:var(--color-fg-3)">#334155</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#64748B;border-radius:4px"></span><span style="color:#64748B;flex:1">fg-3 · Secondary, labels</span><span class="mono" style="color:var(--color-fg-3)">#64748B</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#94A3B8;border-radius:4px"></span><span style="color:#94A3B8;flex:1">fg-4 · Hint, placeholder</span><span class="mono" style="color:var(--color-fg-3)">#94A3B8</span></div>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:10px">Surface &amp; border</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#F4F6FA;border:1px solid #E1E6EF;border-radius:4px"></span><span style="flex:1;color:var(--color-fg-1)">bg-app</span><span class="mono" style="color:var(--color-fg-3)">#F4F6FA</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#FFFFFF;border:1px solid #E1E6EF;border-radius:4px"></span><span style="flex:1;color:var(--color-fg-1)">bg-surface</span><span class="mono" style="color:var(--color-fg-3)">#FFFFFF</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#F8FAFC;border:1px solid #E1E6EF;border-radius:4px"></span><span style="flex:1;color:var(--color-fg-1)">bg-subtle (row hover)</span><span class="mono" style="color:var(--color-fg-3)">#F8FAFC</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:20px;background:#E1E6EF;border-radius:4px"></span><span style="flex:1;color:var(--color-fg-1)">border</span><span class="mono" style="color:var(--color-fg-3)">#E1E6EF</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
