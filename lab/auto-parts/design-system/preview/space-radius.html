<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card">
  <div class="label" style="margin-bottom:6px">Border radius</div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:#ECF7F1;border:1.5px solid #1F8A5B;border-radius:4px"></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">xs</div><div class="mono" style="color:var(--color-fg-3)">4 · tag</div></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:#ECF7F1;border:1.5px solid #1F8A5B;border-radius:6px"></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">sm</div><div class="mono" style="color:var(--color-fg-3)">6 · button/input</div></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:#ECF7F1;border:1.5px solid #1F8A5B;border-radius:8px"></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">md</div><div class="mono" style="color:var(--color-fg-3)">8 · card</div></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:#ECF7F1;border:1.5px solid #1F8A5B;border-radius:10px"></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">lg</div><div class="mono" style="color:var(--color-fg-3)">10 · modal</div></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:#ECF7F1;border:1.5px solid #1F8A5B;border-radius:14px"></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">xl</div><div class="mono" style="color:var(--color-fg-3)">14 · hero</div></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:32px;background:#ECF7F1;border:1.5px solid #1F8A5B;border-radius:999px"></div><div style="text-align:center"><div style="font-size:13px;font-weight:600;color:var(--color-fg-1)">pill</div><div class="mono" style="color:var(--color-fg-3)">999 · pill</div></div></div>
  </div>
</div>
</body></html>
